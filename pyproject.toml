# Root of the RCA MVP PRODUCT uv workspace.
# Members are the shipped product packages only. `rca_simulator/` is dev-only test
# infrastructure (ADR-0012) and is intentionally NOT a member — it has its own venv.
[tool.uv.workspace]
members = ["packages/contracts", "packages/connector_sdk", "packages/connectors/*", "packages/mar"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "fastapi>=0.110"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
