text: Sulzer AHLSTAR A22-50 centrifugal charge pump. Single mechanical seal, API Plan
  11 flush. Mechanical seal flush flow nominal 8 L/min. Rated flow 320 m3/h, rated
  head 145 m. Seal faces silicon carbide. Review seal flush plan during any leakage
  event.
