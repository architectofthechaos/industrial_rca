# Product-side infrastructure (separate from rca_simulator's compose).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rca
      POSTGRES_PASSWORD: rca
      POSTGRES_DB: rca_mar
    ports: ["5432:5432"]
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca -d rca_mar"]
      interval: 2s
      timeout: 3s
      retries: 20
