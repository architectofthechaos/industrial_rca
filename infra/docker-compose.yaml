# Product-side infrastructure (separate from rca_simulator's compose).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rca
      POSTGRES_PASSWORD: rca
      POSTGRES_DB: rca_mar
    ports: ["5432:5432"]
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca -d rca_mar"]
      interval: 2s
      timeout: 3s
      retries: 20
  neo4j:
    image: neo4j:5-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-rca-dev-password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-rca-dev-password} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  neo4j_data:
