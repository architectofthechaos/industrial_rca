# Product-side infrastructure (separate from rca_simulator's compose).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rca
      POSTGRES_PASSWORD: rca
      POSTGRES_DB: rca_mar
    ports: ["5432:5432"]
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca -d rca_mar"]
      interval: 2s
      timeout: 3s
      retries: 20
  neo4j:
    image: neo4j:5-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-rca-dev-password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-rca-dev-password} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
  temporal:
    # Temporal dev cluster using shared postgres. auto-setup creates the
    # `temporal` and `temporal_visibility` databases inside the rca postgres
    # instance on first start (idempotent).
    image: temporalio/auto-setup:1.22
    ports: ["7233:7233"]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: rca
      POSTGRES_PWD: rca
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # tctl is bundled in the auto-setup image.
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  temporal-ui:
    image: temporalio/ui:2.26.2
    ports: ["8080:8080"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    depends_on:
      - temporal

volumes:
  neo4j_data:
