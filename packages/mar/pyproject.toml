[project]
name = "rca-mar"
version = "0.0.1"
description = "Master Asset Registry (EPIC-012) — canonical asset identity + resolution + MCP tools."
requires-python = ">=3.12"
dependencies = [
    "rca-contracts",
    "rca-connector-sdk",
    "rca-kg",
    "pydantic>=2",
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyyaml>=6",
    "fastmcp>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rca_mar"]

[tool.uv.sources]
rca-contracts = { workspace = true }
rca-connector-sdk = { workspace = true }
rca-kg = { workspace = true }
