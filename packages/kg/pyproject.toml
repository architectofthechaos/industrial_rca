[project]
name = "rca-kg"
version = "0.0.1"
description = "Knowledge Graph (Sprint 2a) — ISO 14224 ontology + plant hierarchy skeleton + KG MCP tools."
requires-python = ">=3.12"
dependencies = [
    "rca-contracts",
    "rca-connector-sdk",
    "pydantic>=2",
    "neo4j>=5",
    "fastmcp>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rca_kg"]

[tool.uv.sources]
rca-contracts = { workspace = true }
rca-connector-sdk = { workspace = true }
