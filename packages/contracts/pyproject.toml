[project]
name = "rca-contracts"
version = "0.0.1"
description = "Canonical Pydantic contracts for the RCA MVP (single source of truth for interfaces)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rca_contracts"]
