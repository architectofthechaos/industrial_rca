[project]
name = "rca-connector-sdk"
version = "0.0.1"
description = "Shared platform every connector imports: validation, provenance, units, time, errors, retries, MCP skeleton."
requires-python = ">=3.12"
dependencies = [
    "rca-contracts",
    "pydantic>=2",
    "httpx>=0.27",
    "tenacity>=8",
    "fastmcp>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rca_connector_sdk"]

[tool.uv.sources]
rca-contracts = { workspace = true }
