[project]
name = "rca-llm"
version = "0.0.1"
description = "LLM client + prompt registry (Sprint 3 WI1) — the single non-bypassable LLM abstraction: provenance, caching, budget enforcement, audit."
requires-python = ">=3.12"
dependencies = [
    "rca-contracts",
    "rca-connector-sdk",
    "rca-mar",
    "pydantic>=2",
    "pyyaml>=6",
    "jsonschema>=4",
]

# anthropic + voyageai are imported LAZILY inside the live transports only, so the
# hermetic test suite (replay-from-cache exclusively) runs without them installed.
[project.optional-dependencies]
live = ["anthropic>=0.40", "voyageai>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rca_llm"]

[tool.uv.sources]
rca-contracts = { workspace = true }
rca-connector-sdk = { workspace = true }
rca-mar = { workspace = true }
