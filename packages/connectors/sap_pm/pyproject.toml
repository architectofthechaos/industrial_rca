[project]
name = "rca-connector-sap-pm"
version = "0.0.1"
description = "SAP PM connector (S13.4) — SAP OData v2 notifications -> canonical WorkOrder via connector_sdk."
requires-python = ">=3.12"
dependencies = [
    "rca-connector-sdk",
    "rca-contracts",
    "pydantic>=2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rca_connector_sap_pm"]

[tool.uv.sources]
rca-connector-sdk = { workspace = true }
rca-contracts = { workspace = true }
