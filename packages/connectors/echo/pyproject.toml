[project]
name = "rca-connector-echo"
version = "0.0.1"
description = "Toy echo connector + echo source — proves the connector_sdk end-to-end (EPIC-013 S13.1 DoD)."
requires-python = ">=3.12"
dependencies = [
    "rca-connector-sdk",
    "rca-contracts",
    "pydantic>=2",
    "httpx>=0.27",
    "fastapi>=0.110",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rca_connector_echo"]

[tool.uv.sources]
rca-connector-sdk = { workspace = true }
rca-contracts = { workspace = true }
