[project]
name = "rca-connector-documents"
version = "0.0.1"
description = "Documents connector (S13.6) — SharePoint/Graph + S3 -> canonical DocumentRef via connector_sdk."
requires-python = ">=3.12"
dependencies = [
    "rca-connector-sdk",
    "rca-contracts",
    "pydantic>=2",
    "httpx>=0.27",
    "minio>=7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rca_connector_documents"]

[tool.uv.sources]
rca-connector-sdk = { workspace = true }
rca-contracts = { workspace = true }
