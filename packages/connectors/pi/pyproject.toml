[project]
name = "rca-connector-pi"
version = "0.0.1"
description = "PI-backed entity MCPs (tag + operator_log) — PI Web API REST -> canonical MCP contract, built on connector_sdk."
requires-python = ">=3.12"
dependencies = [
    "rca-connector-sdk",
    "rca-contracts",
    "pydantic>=2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rca_connector_pi"]

[tool.uv.sources]
rca-connector-sdk = { workspace = true }
rca-contracts = { workspace = true }
