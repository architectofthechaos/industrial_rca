[project]
name = "rca-connector-opc-ua"
version = "0.0.1"
description = "OPC UA connector (S13.5) — asyncua reads + background subscription -> canonical contracts."
requires-python = ">=3.12"
dependencies = [
    "rca-connector-sdk",
    "rca-contracts",
    "pydantic>=2",
    "asyncua>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rca_connector_opc_ua"]

[tool.uv.sources]
rca-connector-sdk = { workspace = true }
rca-contracts = { workspace = true }
