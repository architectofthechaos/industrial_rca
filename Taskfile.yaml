# Product workspace tasks (packages/*). The simulators have their own Taskfile in
# rca_simulator/ — they stay a separate project (ADR-0012); we only talk to them over HTTP.
# Requires go-task (https://taskfile.dev).
version: "3"

tasks:
  default:
    desc: List tasks
    cmds: ["task --list"]
    silent: true

  test:
    desc: Run the product workspace test suite (parity tests skip if their sim isn't up)
    # sap_pm is parked for Phase 1 (Maximo is the sole CMMS source — sprint1_spec.md
    # locked decisions). The package stays in the repo/workspace; its tests run only
    # via the explicit parity:sap / parity:cross tasks.
    cmds: ["uv run pytest -q --ignore=packages/connectors/sap_pm"]

  lint:
    desc: Lint + type-check the product packages
    cmds:
      - "uv run ruff check packages"
      - >
        uv run mypy packages/contracts/src packages/connector_sdk/src
        packages/connectors/echo/src packages/connectors/pi/src
        packages/connectors/sap_pm/src packages/connectors/maximo/src
        packages/connectors/documents/src packages/connectors/opc_ua/src
        packages/connectors/mqtt/src packages/connectors/asset_hierarchy/src
        packages/mar/src packages/kg/src packages/connections_api/src
        packages/onboarding/src packages/llm/src packages/agents/src

  parity:pi:
    desc: Run the tag/operator_log parity tests against the REAL PI simulator (starts + tears it down)
    cmds:
      - cd rca_simulator && task up:pi
      - defer: cd rca_simulator && task down:pi
      - sleep 4
      - uv run pytest packages/connectors/pi/tests/test_tag_parity.py -q -p no:cacheprovider

  parity:asset_hierarchy:
    desc: Run the asset_hierarchy crawler tests against the REAL PI simulator (AF endpoints live there)
    cmds:
      - cd rca_simulator && task up:pi
      - defer: cd rca_simulator && task down:pi
      - sleep 4
      - uv run pytest packages/connectors/asset_hierarchy -q -p no:cacheprovider

  parity:sap:
    desc: Run the SAP PM connector parity test against the REAL SAP simulator (starts + tears it down)
    cmds:
      - cd rca_simulator && task up:sap
      - defer: cd rca_simulator && task down:sap
      - sleep 4
      - uv run pytest packages/connectors/sap_pm/tests/test_sap_pm_parity.py -q -p no:cacheprovider

  parity:maximo:
    desc: Run the work_order MCP parity test against the REAL Maximo simulator (starts + tears down)
    cmds:
      - cd rca_simulator && task up:maximo
      - defer: cd rca_simulator && task down:maximo
      - sleep 4
      - uv run pytest packages/connectors/maximo/tests/test_work_order_parity.py -q -p no:cacheprovider

  parity:documents:
    desc: Run the document MCP parity test against the REAL docs simulator (starts + tears down)
    cmds:
      - cd rca_simulator && task up:documents
      - defer: cd rca_simulator && task down:documents
      - sleep 4
      - uv run pytest packages/connectors/documents/tests/test_document_parity.py -q -p no:cacheprovider

  parity:opcua:
    desc: Run the OPC UA connector parity test against the REAL OPC UA simulator (starts + tears down)
    cmds:
      - cd rca_simulator && task up:opcua
      - defer: cd rca_simulator && task down:opcua
      - sleep 5
      - uv run pytest packages/connectors/opc_ua/tests/test_opcua_parity.py -q -p no:cacheprovider

  parity:mqtt:
    desc: Run the MQTT/UNS connector parity test against the REAL broker + publisher (starts + tears down)
    cmds:
      - cd rca_simulator && task up:mqtt
      - defer: cd rca_simulator && task down:mqtt
      - sleep 8
      - uv run pytest packages/connectors/mqtt/tests/test_mqtt_parity.py -q -p no:cacheprovider

  parity:cross:
    desc: Cross-source contract test — SAP + Maximo unify under canonical WorkOrder (starts BOTH sims)
    cmds:
      - cd rca_simulator && task up:maximo
      - cd rca_simulator && task up:sap
      - defer: cd rca_simulator && task down:maximo
      - defer: cd rca_simulator && task down:sap
      - sleep 5
      - uv run pytest packages/cross_source_tests/test_cmms_cross_source_parity.py -q -p no:cacheprovider

  parity:all:
    desc: Run EVERY connector parity test against its real simulator (sequential; each starts + tears down its own sim)
    cmds:
      - task: parity:pi
      - task: parity:sap
      - task: parity:maximo
      - task: parity:documents
      - task: parity:opcua
      - task: parity:mqtt
      - task: parity:cross

  mar:db:up:
    desc: Start the product Postgres (:5432)
    cmds: ["docker compose -f infra/docker-compose.yaml up -d postgres"]

  mar:db:down:
    desc: Stop + remove the product Postgres
    cmds: ["docker compose -f infra/docker-compose.yaml rm -sf postgres"]

  mar:migrate:
    desc: Apply MAR migrations to the running Postgres
    cmds:
      - cd packages/mar && uv run alembic upgrade head

  mar:db:
    desc: Start Postgres, migrate, run MAR DB-integration tests, tear down
    cmds:
      - task: mar:db:up
      - defer: { task: mar:db:down }
      - sleep 4
      - task: mar:migrate
      - uv run pytest packages/mar/tests/test_pg_repo.py -q -p no:cacheprovider

  test:mar:
    desc: Run hermetic MAR tests (no DB, no sim)
    cmds:
      - uv run pytest packages/mar -q --ignore=packages/mar/tests/test_pg_repo.py --ignore=packages/mar/tests/test_mar_wire_parity.py

  kg:db:up:
    desc: Start the product Neo4j (:7474 http, :7687 bolt) and wait until healthy
    cmds: ["docker compose -f infra/docker-compose.yaml up -d --wait neo4j"]

  kg:db:down:
    desc: Stop + remove the product Neo4j
    cmds: ["docker compose -f infra/docker-compose.yaml rm -sf neo4j"]

  kg:migrate:
    desc: Apply KG cypher migrations to the running Neo4j
    cmds: ["uv run python -m rca_kg.migrate"]

  kg:seed:
    desc: Apply the KG seed files (ISO 14224 BB1 ontology + refplant hierarchy) idempotently
    cmds: ["uv run python -m rca_kg.seed"]

  test:kg:
    desc: Run KG tests (live ones skip if Neo4j isn't up)
    cmds: ["uv run pytest packages/kg -q"]

  parity:mar-wire:
    desc: Resolver wire-in — MarResolver drives the Maximo connector against the REAL Maximo sim
    cmds:
      - cd rca_simulator && task up:maximo
      - defer: cd rca_simulator && task down:maximo
      - sleep 4
      - uv run pytest packages/mar/tests/test_mar_wire_parity.py -q -p no:cacheprovider

  api:connections:
    desc: Serve the Connections REST API (:8200, OpenAPI at /docs) over the configured Postgres MAR
    cmds:
      - cd packages/connections_api && uv run uvicorn rca_connections_api.app:create_app --factory --port 8200

  temporal:up:
    desc: Start the Temporal dev cluster (server :7233 + UI :8080). auto-setup creates temporal/temporal_visibility DBs in the shared postgres; healthcheck may take 20-40s on first boot.
    cmds:
      - docker compose -f infra/docker-compose.yaml up -d temporal temporal-ui

  temporal:down:
    desc: Stop + remove the Temporal dev cluster (server + UI)
    cmds:
      - docker compose -f infra/docker-compose.yaml rm -sf temporal temporal-ui

  infra:up:
    desc: Bring up the full product infra stack (postgres, neo4j, temporal, temporal-ui)
    cmds:
      - docker compose -f infra/docker-compose.yaml up -d --wait postgres neo4j temporal temporal-ui

  infra:lite:
    # Daily-iteration shortcut (risk callout #2): skip the Temporal cluster so that
    # developers working on MAR/KG/connections don't wait for auto-setup's 20-40s
    # postgres provisioning on each iteration. Use `task temporal:up` when you need
    # the onboarding worker.
    desc: Bring up ONLY postgres + neo4j (skip Temporal — use for MAR/KG-only iteration)
    cmds:
      - docker compose -f infra/docker-compose.yaml up -d --wait postgres neo4j

  onboarding:worker:
    desc: Run the onboarding Temporal worker (serves the rca-onboarding task queue; needs temporal + postgres + neo4j up)
    cmds:
      - uv run python -m rca_onboarding.worker

  api:onboarding:
    desc: Serve the Onboarding trigger/query API (:8300, OpenAPI at /docs) — POST /onboarding/run starts a workflow
    cmds:
      - cd packages/onboarding && uv run uvicorn rca_onboarding.api:create_app --factory --port 8300

  probe:worker:
    desc: "Run the probe Temporal worker (rca-probes queue — Sprint 3 G12). NOTE: needs the production build_deps wiring (Postgres repos + Neo4jAssetGraph + McpToolBox + live LLM) — see sprint3_state_report.md 'Deferred to next sprint'; runnable today only with an injected deps bundle."
    cmds:
      - uv run python -m rca_agents.worker

  api:probes:
    desc: Serve the Probe API (:8400, OpenAPI at /docs) — POST /probes/run starts an end-to-end probe; HITL via /probes/runs/{id}/hitl/*
    cmds:
      - cd packages/agents && uv run uvicorn rca_agents.api:create_app --factory --port 8400

  stack:up:
    desc: Bring up the FULL live stack — infra (pgvector+Neo4j+Temporal) + migrations + KG seed + simulators + refplant connections. Then run `task probe:worker`.
    cmds:
      - task: infra:up
      - task: mar:migrate
      - task: kg:migrate
      - task: kg:seed
      - cd rca_simulator && task up
      - uv run python scripts/seed_refplant_assets.py
      - uv run python scripts/seed_refplant_connections.py
      - 'echo "stack up. Now run: task probe:worker"'

  probe:host:
    desc: (optional) Serve the entity MCP host over HTTP for an out-of-process run (Sprint 5 path)
    cmds:
      - uv run python -m rca_agents.host

  test:agents:
    desc: Run the Sprint 3 LLM + agents hermetic tests (no DB, no sim, no cluster)
    cmds:
      - uv run pytest packages/llm packages/agents -q
